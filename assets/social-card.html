<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>co-review</title>
<style>
  :root {
    --bg-deep: #08080a;
    --bg: #0d0d10;
    --surface: #16161a;
    --surface-2: #1c1c22;
    --border: #2a2a32;
    --hairline: rgba(255, 255, 255, 0.08);
    --text: #f5f5f7;
    --text-soft: #c8c8d0;
    --text-dim: #8a8a94;
    --text-faint: #56565e;
    /* Claude palette */
    --claude: #d97757;
    --claude-bright: #e88e6d;
    --claude-soft: rgba(217, 119, 87, 0.20);
    --claude-bg: #f5ecdf;            /* warm cream, matches Claude desktop app icon */
    --claude-bg-edge: #ead8be;
    /* Codex palette: matches lobe-icons codex-color gradient */
    --codex-1: #b1a7ff;
    --codex-2: #7a9dff;
    --codex-3: #3941ff;
    --codex: #7a9dff;
    --codex-soft: rgba(122, 157, 255, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "ss01", "ss02", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }

  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background:
      radial-gradient(640px 460px at 78% 22%, var(--claude-soft) 0%, transparent 60%),
      radial-gradient(640px 460px at 92% 90%, var(--codex-soft) 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 100%, rgba(255, 255, 255, 0.025) 0%, transparent 60%),
      var(--bg-deep);
  }

  /* Hairline grid faded at edges */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 55%, black 35%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 55%, black 35%, transparent 80%);
    pointer-events: none;
  }

  /* ============ LEFT: BRAND STACK ============ */
  .brand {
    position: absolute;
    left: 0; top: 0;
    width: 540px; height: 640px;
    padding: 60px 0 56px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  .slug {
    font-family: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .slug-dot {
    width: 6px; height: 6px;
    background: var(--codex);
    border-radius: 50%;
    box-shadow: 0 0 9px var(--codex), 0 0 2px var(--codex-1);
  }

  .hero-block { display: flex; flex-direction: column; }

  .wordmark {
    font-size: 104px;
    letter-spacing: -0.055em;
    line-height: 0.88;
    color: var(--text);
    margin-left: -3px;
    white-space: nowrap;
  }
  .wordmark .co {
    font-weight: 200;
    color: var(--text-faint);
  }
  .wordmark .review {
    font-weight: 800;
    color: var(--text);
    background: linear-gradient(180deg, #ffffff 0%, #d4d4d8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .accent-bar {
    margin-top: 30px;
    width: 88px;
    height: 3px;
    background: linear-gradient(90deg, var(--claude) 0%, var(--codex) 100%);
    border-radius: 2px;
  }

  .tagline {
    margin-top: 22px;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.36;
    color: var(--text-soft);
    letter-spacing: -0.013em;
    max-width: 420px;
  }
  .tagline .with-claude { color: var(--claude-bright); font-weight: 600; }
  .tagline .with-codex { color: var(--codex-1); font-weight: 600; }
  .tagline .soft { color: var(--text-dim); }

  .footmeta {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .chip {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.025);
    color: var(--text-dim);
    padding: 6px 11px;
    border-radius: 5px;
    text-transform: uppercase;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.13em;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  .repo {
    font-family: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    margin-left: 4px;
  }
  .repo .you { color: var(--text-dim); }

  /* ============ RIGHT: TWO BIG APP ICONS ============ */
  .icons {
    position: absolute;
    right: 0; top: 0;
    width: 760px; height: 640px;
    z-index: 5;
  }

  /* Soft floor glow puddle under the icons */
  .icons::before {
    content: "";
    position: absolute;
    width: 580px; height: 320px;
    bottom: 40px; left: 90px;
    background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(8px);
  }

  /* Common macOS-style app icon (squircle, large shadow, slight inner highlight) */
  .app {
    position: absolute;
    width: 288px;
    height: 288px;
    border-radius: 65px;  /* squircle ~22.5% radius */
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(0, 0, 0, 0.12),
      0 1px 0 rgba(255, 255, 255, 0.04),
      0 24px 40px rgba(0, 0, 0, 0.45),
      0 60px 90px -25px rgba(0, 0, 0, 0.7);
  }

  /* Claude app icon: cream squircle background with the orange burst centered */
  .app.claude {
    top: 78px;
    left: 70px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55) 0%, transparent 55%),
      linear-gradient(160deg, var(--claude-bg) 0%, var(--claude-bg-edge) 100%);
    transform: rotate(-4deg);
  }
  .app.claude::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 80px -10px rgba(217, 119, 87, 0.4);
    pointer-events: none;
  }
  .app.claude svg {
    width: 168px;
    height: 168px;
    display: block;
  }

  /* Codex app icon: already a complete rounded-square mark from lobe-icons */
  .app.codex {
    top: 270px;
    left: 400px;
    background: #ffffff;
    transform: rotate(4deg);
  }
  .app.codex::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 80px -10px rgba(122, 157, 255, 0.45);
    pointer-events: none;
  }
  .app.codex svg {
    width: 196px;
    height: 196px;
    display: block;
  }
  /* The codex SVG has its own white background as the outer rounded shape; we want
     just the gradient mark on top of our white squircle. So hide the SVG's own
     white background and let our parent .app.codex background show through. */
  .app.codex svg path:first-of-type {
    display: none;
  }

</style>
</head>
<body>

<div class="stage">

  <!-- LEFT: BRAND STACK -->
  <div class="brand">
    <div class="slug"><span class="slug-dot"></span>/co-review</div>

    <div class="hero-block">
      <div class="wordmark"><span class="co">co-</span><span class="review">review</span></div>
      <div class="accent-bar"></div>
      <div class="tagline">
        <span class="with-claude">Claude</span> drives.
        <span class="with-codex">Codex</span> reviews.
        <br><span class="soft">You stay in the loop.</span>
      </div>
    </div>

    <div class="footmeta">
      <span class="chip">Claude Code</span>
      <span class="chip">MIT</span>
      <span class="repo">github.com/<span class="you">trigga6006</span>/co-review</span>
    </div>
  </div>

  <!-- RIGHT: TWO BIG APP ICONS -->
  <div class="icons">

    <!-- CLAUDE APP ICON: burst from lobe-icons on warm cream squircle -->
    <div class="app claude">

      </svg>
    </div>

    <!-- CODEX APP ICON: rounded-square gradient chevron mark from lobe-icons -->
    <div class="app codex">

        <!-- first path is the original SVG's white background (hidden via CSS) -->

        <defs>
          <linearGradient id="cx-grad" x1="12" x2="12" y1="3" y2="21" gradientUnits="userSpaceOnUse">
            <stop stop-color="#B1A7FF"/>
            <stop offset=".5" stop-color="#7A9DFF"/>

      </svg>
    </div>

  </div>

</div>

</body>
</html>
